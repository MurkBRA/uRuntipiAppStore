name: Auto-Merge Version Bumps

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: contains(github.event.pull_request.labels.*.name, 'automerge') && !contains(github.event.pull_request.labels.*.name, 'needs-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable Squash Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          ALLOW_AUTO_MERGE=$(gh api "repos/${{ github.repository }}" --jq '.allow_auto_merge // false' || echo "false")
          if [ "$ALLOW_AUTO_MERGE" != "true" ]; then
            echo "::warning::Repository setting 'Allow auto-merge' is disabled. Enable Settings -> General -> Pull Requests -> Allow auto-merge to enable automatic squash merges."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
