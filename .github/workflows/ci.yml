name: uRuntipiAppStore CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & App Store Tests (Layers 1, 2 & 3)
        run: npm test

      - name: Validate Docker Compose syntax on changed apps (Layer 4)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_APPS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^apps/[^_]*/' | cut -d/ -f2 | sort -u || true)
          for app in $CHANGED_APPS; do
            if [ -f "apps/$app/docker-compose.yml" ]; then
              echo "Validating docker compose config for $app..."
              APP_DATA_DIR="/tmp/app-data/$app" APP_DOMAIN="localhost" APP_PROTOCOL="http" LOCAL_DOMAIN="tipi.local" INTERNAL_IP="127.0.0.1" \
                docker compose -f "apps/$app/docker-compose.yml" config -q
            fi
          done
