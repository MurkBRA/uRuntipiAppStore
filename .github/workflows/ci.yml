name: uRuntipiAppStore CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter (Biome)
        run: npm run lint

      - name: Run Unit & App Store Tests (Layers 1, 2 & 3)
        run: npm test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Compose Validation & Smoke Test on changed apps (Layers 4 & 5)
        if: github.event_name == 'pull_request'
        run: npm run test:smoke -- --base=origin/${{ github.base_ref }}
