name: uRuntipiAppStore CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & App Store Tests (Layers 1, 2 & 3)
        run: npm test

      - name: Docker Compose Validation & Smoke Test on changed apps (Layers 4 & 5)
        if: github.event_name == 'pull_request'
        run: npm run test:smoke -- --base=origin/${{ github.base_ref }}
