name: uRuntipiAppStore CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck (tsc)
        run: npm run typecheck

      - name: Run Linter (Biome)
        run: npm run lint

      - name: Run Unit & App Store Tests (Layers 1, 2 & 3)
        run: npm test

      - name: Reclaim runner disk space before PR smoke tests
        if: github.event_name == 'pull_request'
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          docker system prune -af --volumes || true
          df -h /

      - name: Login to GitHub Container Registry
        if: github.event_name == 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Compose Validation & Smoke Test on changed apps (Layers 4 & 5)
        if: github.event_name == 'pull_request'
        run: npm run test:smoke -- --changed --base=origin/${{ github.base_ref }} --prune --report-md=/tmp/smoke-report-ci.md

      - name: Append CI Smoke Report to Job Summary
        if: github.event_name == 'pull_request' && always()
        run: |
          if [ -f /tmp/smoke-report-ci.md ]; then
            cat /tmp/smoke-report-ci.md >> "$GITHUB_STEP_SUMMARY"
          fi
