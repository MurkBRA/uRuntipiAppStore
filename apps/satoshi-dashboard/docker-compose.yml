services:
  satoshi-dashboard:
    image: ghcr.io/satoshi-dashboard/main:v1.1.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data:/app/server/.runtime-cache
    environment:
      - SERVE_STATIC=true
      - API_PORT=8410
      - API_HOST=0.0.0.0
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 8410
      is_main: true
x-runtipi:
  schema_version: 2
