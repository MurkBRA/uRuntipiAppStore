services:
  jotty:
    image: ghcr.io/fccview/jotty:1.29.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data
      - ${APP_DATA_DIR}/data/config:/app/config
      - ${APP_DATA_DIR}/data/cache:/app/.next/cache
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://localhost:3000
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
