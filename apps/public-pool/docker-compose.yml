services:
  public-pool:
    image: nginx:1.25.3
    volumes:
      - ${APP_DATA_DIR}/data/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - public-pool-web
      - public-pool-server
    x-runtipi:
      internal_port: 80
      add_to_main_network: true
      is_main: true
  public-pool-web:
    image: ghcr.io/benjamin-wilson/public-pool-ui:5f730f4
    environment:
      - DOMAIN=${APP_DOMAIN}
      - PUBLIC_POOL_STRATUM_URL=${APP_DOMAIN}:2018
    stop_grace_period: 30s
    x-runtipi:
      add_to_main_network: true
  public-pool-server:
    image: ghcr.io/benjamin-wilson/public-pool:95565ee
    ports:
      - 2018:2018/tcp
    volumes:
      - ${APP_DATA_DIR}/data/database:/public-pool/DB
    environment:
      - NODE_ENV=production
      - BITCOIN_RPC_URL=http://${APP_BITCOIN_NODE_IP}
      - BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - BITCOIN_RPC_PASSWORD=${APP_BITCOIN_RPC_PASS}
      - BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - BITCOIN_RPC_TIMEOUT=10000
      - API_PORT=2019
      - STRATUM_PORT=2018
      - NETWORK=mainnet
      - API_SECURE=false
      - ENABLE_SOLO=true
      - ENABLE_PROXY=false
      - POOL_IDENTIFIER="Public Pool on Umbrel"
    stop_grace_period: 30s
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
