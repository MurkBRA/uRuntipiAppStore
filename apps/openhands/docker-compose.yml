services:
  openhands:
    image: ghcr.io/openhands/openhands:1.10.0
    volumes:
      - ${APP_DATA_DIR}/data/docker:/var/run
      - ${APP_DATA_DIR}/data/openhands:/.openhands
      - ${APP_DATA_DIR}/data/workspace:/opt/workspace_base
    environment:
      - AGENT_SERVER_IMAGE_REPOSITORY=ghcr.io/openhands/agent-server
      - AGENT_SERVER_IMAGE_TAG=1.33.0-python
      - SANDBOX_HOST_PORT=3994
      - SANDBOX_CONTAINER_URL_PATTERN=http://localhost:{port}
      - WORKSPACE_MOUNT_PATH=/opt/workspace_base
      - LOG_ALL_EVENTS=true
    depends_on:
      openhands-docker:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
      - ${LOCAL_DOMAIN}:host-gateway
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/3000' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    stdin_open: true
    tty: true
    x-runtipi:
      internal_port: 3000
      is_main: true
  openhands-docker:
    image: docker:28.0.4-dind
    command: |-
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --iptables=false
        --pidfile /data/docker.pid
    entrypoint: /entrypoint.sh
    volumes:
      - ${APP_DATA_DIR}/data/entrypoint.sh:/entrypoint.sh
      - ${APP_DATA_DIR}/data/docker:/data
    environment:
      - DOCKER_ENSURE_BRIDGE=dind0:10.32.0.1/16
    network_mode: host
    privileged: true
    stop_grace_period: 1m
x-runtipi:
  schema_version: 2
