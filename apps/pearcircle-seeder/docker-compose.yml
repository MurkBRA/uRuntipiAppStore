services:
  pearcircle-seeder:
    image: ghcr.io/peerloomllc/pearcircle-seeder:1.1.4
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - SEEDER_HOST=0.0.0.0
      - SEEDER_PORT=8730
      - SEEDER_NO_AUTH=1
      - SEEDER_NO_UPDATE_CHECK=1
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 8730
      is_main: true
x-runtipi:
  schema_version: 2
