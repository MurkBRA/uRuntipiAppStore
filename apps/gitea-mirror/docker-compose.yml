services:
  gitea-mirror:
    image: ghcr.io/raylabshq/gitea-mirror:v3.43.0
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - BETTER_AUTH_SECRET=${APP_SEED}
      - BETTER_AUTH_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - BETTER_AUTH_TRUSTED_ORIGINS=*
      - NODE_ENV=production
      - DATABASE_URL=file:data/gitea-mirror.db
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_BETTER_AUTH_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - MIRROR_ISSUE_CONCURRENCY=3
      - MIRROR_PULL_REQUEST_CONCURRENCY=5
    healthcheck:
      test: wget --no-verbose --tries=3 --spider http://localhost:4321/api/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    x-runtipi:
      internal_port: 4321
      is_main: true
x-runtipi:
  schema_version: 2
