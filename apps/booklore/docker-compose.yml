services:
  booklore:
    image: ghcr.io/booklore-app/booklore:v2.4.0
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data
      - ${APP_DATA_DIR}/data/books:/books
      - ${APP_DATA_DIR}/data/bookdrop:/bookdrop
    environment:
      - DATABASE_URL=jdbc:mariadb://booklore-db:3306/booklore
      - DATABASE_USERNAME=bookloreuser
      - DATABASE_PASSWORD=booklorepass
    depends_on:
      booklore-db:
        condition: service_started
    x-runtipi:
      internal_port: 6060
      is_main: true
  booklore-db:
    image: mariadb:12.0.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=booklore
      - MARIADB_USER=bookloreuser
      - MARIADB_PASSWORD=booklorepass
      - MARIADB_ROOT_PASSWORD=rootpass
x-runtipi:
  schema_version: 2
