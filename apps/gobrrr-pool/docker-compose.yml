services:
  gobrrr-pool:
    image: ghcr.io/gobrrrme/gobrrr-pool-webui:v1.2.1
    volumes:
      - ${APP_DATA_DIR}/data/ckpool-socket:/tmp/ckpool:ro
      - ${APP_DATA_DIR}/data/ckpool-logs:/var/log/ckpool:ro
      - ${APP_DATA_DIR}/data/webui:/app/data
    environment:
      - NODE_ENV=production
      - PORT=21421
      - CKPOOL_SOCKET_DIR=/tmp/ckpool
      - CKPOOL_LOGS_DIR=/var/log/ckpool
      - STRATUM_PORT=21420
      - BITCOIN_RPC_HOST=${APP_BITCOIN_NODE_IP}
      - BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
    depends_on:
      - gobrrr-pool-ckpool
    stop_grace_period: 30s
    x-runtipi:
      internal_port: 21421
      add_to_main_network: true
      is_main: true
  gobrrr-pool-ckpool:
    image: ghcr.io/gobrrrme/gobrrr-ckpool:v1.2.1
    ports:
      - 21420:3333/tcp
      - 21422:4444/tcp
    volumes:
      - ${APP_DATA_DIR}/data/ckpool-socket:/tmp/ckpool
      - ${APP_DATA_DIR}/data/ckpool-logs:/var/log/ckpool
    environment:
      - BITCOIN_RPC_HOST=${APP_BITCOIN_NODE_IP}
      - BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
      - BITCOIN_ZMQ_HASHBLOCK=tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}
      - POOL_SIGNATURE=GoBrrrPool_Umbrel
      - START_DIFFICULTY=10000
      - MIN_DIFFICULTY=1
      - BLOCKPOLL=50
      - UPDATE_INTERVAL=20
      - STRATUM_HIGHDIFF_PORT=4444
      - HIGHDIFF=1000000
    healthcheck:
      test: test -f /var/log/ckpool/ckpool.log
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 1m
    x-runtipi:
      add_to_main_network: true
  gobrrr-pool-gobrrr-stats:
    image: rodb2008com/gobrrr-pool-api-etl:v1
    volumes:
      - ${APP_DATA_DIR}/data/ckpool-logs:/data:ro
    depends_on:
      gobrrr-pool-ckpool:
        condition: service_healthy
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
