services:
  route96:
    image: voidic/route96:v0.7.0
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/app/data
      - ${APP_DATA_DIR}/data/config.yaml:/app/config.yaml
    environment:
      - RUST_LOG=info
      - APP_PUBLIC_URL=http://${APP_DOMAIN}:8002
    depends_on:
      - route96-db
    x-runtipi:
      internal_port: 8002
      is_main: true
  route96-db:
    image: mariadb:11.2.4
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=moneyprintergobrrr
      - MYSQL_USER=route96
      - MYSQL_PASSWORD=moneyprintergobrrr
      - MYSQL_DATABASE=route96
x-runtipi:
  schema_version: 2
