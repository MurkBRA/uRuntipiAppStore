services:
  simple-torrent:
    image: boypt/cloud-torrent:1.3.9
    command: '--port=8086 --config-path /config/simple-torrent.json'
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/torrents:/torrents
      - ${APP_DATA_DIR}/data/downloads:/downloads
      - ${APP_DATA_DIR}/data/config:/config
    x-runtipi:
      internal_port: 8086
      is_main: true
x-runtipi:
  schema_version: 2
