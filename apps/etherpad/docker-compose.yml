services:
  etherpad:
    image: etherpad/etherpad:3.3.9
    user: '5001:0'
    volumes:
      - ${APP_DATA_DIR}/data/plugins:/opt/etherpad-lite/src/plugin_packages
      - ${APP_DATA_DIR}/data/etherpad-var:/opt/etherpad-lite/var
    environment:
      - NODE_ENV=production
      - CI=true
      - ADMIN_PASSWORD=${APP_PASSWORD}
      - DB_CHARSET=utf8mb4
      - DB_HOST=etherpad-postgres
      - DB_NAME=etherpad
      - DB_PASS=admin
      - DB_PORT=5432
      - DB_TYPE=postgres
      - DB_USER=admin
      - DISABLE_IP_LOGGING=false
      - LOGLEVEL=INFO
      - ALLOW_UNKNOWN_FILE_ENDS=true
      - TRUST_PROXY=true
      - SKIN_NAME=colibris
      - SKIN_VARIANTS=super-light-toolbar super-light-editor light-background
      - SHOW_SETTINGS_IN_ADMIN_PAGE=true
      - SUPPRESS_ERRORS_IN_PAD_TEXT=false
    depends_on:
      - etherpad-postgres
    x-runtipi:
      internal_port: 9001
      is_main: true
  etherpad-postgres:
    image: postgres:15-alpine
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data/pgdata
    environment:
      - POSTGRES_DB=etherpad
      - POSTGRES_PASSWORD=admin
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - PGDATA=/var/lib/postgresql/data/pgdata
x-runtipi:
  schema_version: 2
