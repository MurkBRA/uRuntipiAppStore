services:
  synapse:
    image: matrixdotorg/synapse:v1.163.0
    command: |-
      -c './start.py generate && ./start.py migrate_config && echo -e "
      enable_registration_without_verification: true" >> /data/homeserver.yaml && exec ./start.py'
    entrypoint: bash
    volumes:
      - ${APP_DATA_DIR}/data/synapse:/data
    environment:
      - UID=1000
      - GID=1000
      - SYNAPSE_HTTP_PORT=8008
      - SYNAPSE_SERVER_NAME=${APP_DOMAIN}
      - SYNAPSE_REPORT_STATS=yes
      - SYNAPSE_ENABLE_REGISTRATION=yes
      - SYNAPSE_NO_TLS=yes
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 8008
      is_main: true
x-runtipi:
  schema_version: 2
