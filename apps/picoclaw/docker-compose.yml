services:
  picoclaw:
    image: docker.io/sipeed/picoclaw:v0.3.1-launcher
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - PICOCLAW_HOME=/data
    x-runtipi:
      internal_port: 18800
      is_main: true
x-runtipi:
  schema_version: 2
