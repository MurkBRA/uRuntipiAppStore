services:
  adventurelog:
    image: ghcr.io/seanmorley15/adventurelog-frontend:v0.13.0
    environment:
      - PUBLIC_SERVER_URL=http://adventurelog-server:8000
      - ORIGIN=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - BODY_SIZE_LIMIT=Infinity
    depends_on:
      - adventurelog-server
    x-runtipi:
      internal_port: 3000
      is_main: true
  adventurelog-db:
    image: ghcr.io/baosystems/postgis:15-3.5
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=database
      - POSTGRES_USER=adventure
      - POSTGRES_PASSWORD=adventure
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: pg_isready -U adventure -d database
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  adventurelog-server:
    image: ghcr.io/seanmorley15/adventurelog-backend:v0.13.0
    ports:
      - 8016:80/tcp
    volumes:
      - ${APP_DATA_DIR}/data/app:/code/media/
    environment:
      - PGHOST=adventurelog-db
      - PGDATABASE=database
      - PGUSER=adventure
      - PGPASSWORD=adventure
      - SECRET_KEY=adventure
      - DJANGO_ADMIN_USERNAME=admin
      - DJANGO_ADMIN_PASSWORD=admin
      - DJANGO_ADMIN_EMAIL=admin@example.com
      - PUBLIC_URL=http://${APP_DOMAIN}:8016
      - CSRF_TRUSTED_ORIGINS=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - DEBUG=False
      - FRONTEND_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    depends_on:
      adventurelog-db:
        condition: service_healthy
x-runtipi:
  schema_version: 2
