services:
  syslog-ng:
    image: rickraven/logdy:0.17.1
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/logs:/data:ro
    environment:
      - LOGDY_MODE=follow
      - LOGDY_FOLLOW_FILES=/data/*.log
      - LOGDY_PASS=${APP_PASSWORD}
    depends_on:
      syslog-ng-syslog:
        condition: service_healthy
    x-runtipi:
      internal_port: 8080
      is_main: true
  syslog-ng-syslog:
    image: linuxserver/syslog-ng:4.10.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    ports:
      - 514:5514/udp
      - 601:6601/tcp
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/logs:/var/log
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    healthcheck:
      test: test -f /var/log/messages-kv.log || touch /var/log/messages-kv.log
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 1m
x-runtipi:
  schema_version: 2
