services:
  nostrudel:
    image: ghcr.io/hzrd149/nostrudel:1.1.0
    environment:
      - REQUEST_PROXY=cors:8080
    depends_on:
      - nostrudel-cors
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 80
      is_main: true
  nostrudel-cors:
    image: ghcr.io/hzrd149/docker-cors-anywhere:0.4.5
    environment:
      - CORSANYWHERE_REQUIRE_HEADERS=host
x-runtipi:
  schema_version: 2
