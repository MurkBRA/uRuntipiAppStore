services:
  fedimintd:
    image: fedimint/fedimintd:v0.12.2
    ports:
      - 8173:8173/tcp
      - 8173:8173/udp
      - 8174:8174/udp
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - FM_ENABLE_IROH=true
      - FM_DATA_DIR=/data
      - FM_BITCOIN_NETWORK=${APP_BITCOIN_NETWORK_ELECTRS}
      - FM_BITCOIND_USERNAME=${APP_BITCOIN_RPC_USER}
      - FM_BITCOIND_PASSWORD=${APP_BITCOIN_RPC_PASS}
      - FM_BITCOIND_URL=http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      - FM_BIND_UI=0.0.0.0:8175
      - FM_PASSWORD_UI=${APP_PASSWORD}
      - FM_PASSWORD_API=${APP_PASSWORD}
    x-runtipi:
      internal_port: 8175
      add_to_main_network: true
      is_main: true
x-runtipi:
  schema_version: 2
