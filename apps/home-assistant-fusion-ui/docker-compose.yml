services:
  home-assistant-fusion-ui:
    image: ghcr.io/matt8707/ha-fusion:2024.10.1
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/fusion:/app/data
    environment:
      - HASS_URL=${HASS_URL:-http://homeassistant-1:8123}
    extra_hosts:
      - host.docker.internal:host-gateway
    x-runtipi:
      internal_port: 5050
      add_to_main_network: true
      is_main: true
x-runtipi:
  schema_version: 2
