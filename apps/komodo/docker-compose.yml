services:
  komodo:
    image: ghcr.io/moghtech/komodo-core:2.3.3
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/core:/backups
      - ${APP_DATA_DIR}/data/keys:/config/keys
    environment:
      - KOMODO_DATABASE_ADDRESS=komodo-ferretdb:27017
      - KOMODO_DATABASE_USERNAME=admin
      - KOMODO_DATABASE_PASSWORD=admin
      - KOMODO_PASSKEY=${APP_PASSWORD}
      - KOMODO_FIRST_SERVER=https://komodo-periphery:8120
      - KOMODO_JWT_SECRET=${APP_SEED}
    depends_on:
      - komodo-ferretdb
    x-runtipi:
      internal_port: 9120
      is_main: true
  komodo-docker:
    image: docker:28.3.0-dind
    command: |-
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --pidfile /data/docker.pid
    entrypoint: /entrypoint.sh
    volumes:
      - ${APP_DATA_DIR}/data/entrypoint.sh:/entrypoint.sh
      - ${APP_DATA_DIR}/data/docker:/data
    environment:
      - DOCKER_ENSURE_BRIDGE=dind0:10.32.0.1/16
    network_mode: host
    privileged: true
    stop_grace_period: 1m
  komodo-postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.104.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=postgres
  komodo-ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.3.1
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/ferretdb:/state
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://admin:admin@komodo-postgres:5432/postgres
    depends_on:
      - komodo-postgres
  komodo-periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3
    volumes:
      - ${APP_DATA_DIR}/data/docker:/var/run
      - /proc:/proc
      - ${APP_DATA_DIR}/data/periphery:/etc/komodo
    environment:
      - COMPOSE_KOMODO_IMAGE_TAG=latest
      - KOMODO_PASSKEY=${APP_PASSWORD}
      - TZ=Europe/Berlin
      - PERIPHERY_ROOT_DIRECTORY=/etc/komodo
      - PERIPHERY_PASSKEYS=${APP_PASSWORD}
      - PERIPHERY_DISABLE_TERMINALS=false
      - PERIPHERY_SSL_ENABLED=true
      - PERIPHERY_INCLUDE_DISK_MOUNTS=/etc/hostname
      - PERIPHERY_LOGGING_PRETTY=false
      - PERIPHERY_PRETTY_STARTUP_CONFIG=false
x-runtipi:
  schema_version: 2
