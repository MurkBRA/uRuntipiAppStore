services:
  miner-sentinel:
    image: dcbert/minersentinel-frontend:v1.2.0
    environment:
      - VITE_API_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    depends_on:
      - miner-sentinel-backend
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 80
      is_main: true
  miner-sentinel-db:
    image: postgres:17.7
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=minersentinel
      - POSTGRES_PASSWORD=minersentinel
      - POSTGRES_DB=minersentinel
    healthcheck:
      test: pg_isready -U minersentinel
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 1m
  miner-sentinel-backend:
    image: dcbert/minersentinel-backend:v1.2.0
    command: |-
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        (python manage.py createsuperuser --no-input ||
        echo 'Superuser already exists or created — winning!') &&
        gunicorn minersentinel.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120
      "
    environment:
      - POSTGRES_HOST=miner-sentinel-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=minersentinel
      - POSTGRES_USER=minersentinel
      - POSTGRES_PASSWORD=minersentinel
      - DJANGO_SECRET_KEY=${APP_SEED}
      - DJANGO_DEBUG=False
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=${APP_PROTOCOL:-http}://${APP_DOMAIN},http://*.ts.net:3082
      - CSRF_TRUSTED_ORIGINS=${APP_PROTOCOL:-http}://${APP_DOMAIN},http://*.ts.net:3082
      - DJANGO_SUPERUSER_USERNAME=admin
      - DJANGO_SUPERUSER_PASSWORD=${APP_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=admin@umbrel.local
      - API_BASE_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    depends_on:
      - miner-sentinel-db
    stop_grace_period: 1m
  miner-sentinel-data-service:
    image: dcbert/minersentinel-data-service:v1.2.0
    environment:
      - POSTGRES_HOST=miner-sentinel-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=minersentinel
      - POSTGRES_USER=minersentinel
      - POSTGRES_PASSWORD=minersentinel
      - BACKEND_URL=http://miner-sentinel-backend:8000
      - BITAXE_POLL_INTERVAL=60
      - AVALON_POLL_INTERVAL=60
      - POOL_POLL_INTERVAL=300
    depends_on:
      - miner-sentinel-db
      - miner-sentinel-backend
    stop_grace_period: 1m
x-runtipi:
  schema_version: 2
