services:
  yamtrack:
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3
    volumes:
      - ${APP_DATA_DIR}/data/db:/yamtrack/db
    environment:
      - SECRET=${APP_SEED}
      - REDIS_URL=redis://yamtrack-redis:6379
    depends_on:
      - yamtrack-redis
    security_opt:
      - no-new-privileges:true
    x-runtipi:
      internal_port: 8000
      is_main: true
  yamtrack-redis:
    image: redis:8.0.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
x-runtipi:
  schema_version: 2
