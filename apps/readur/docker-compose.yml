services:
  readur:
    image: ghcr.io/readur/readur:3.1.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/app/uploads
      - ${APP_DATA_DIR}/data/watch:/app/watch
    environment:
      - DATABASE_URL=postgresql://readur:readur_password@readur-postgres:5432/readur
      - JWT_SECRET=${APP_SEED}
      - SERVER_ADDRESS=0.0.0.0:8000
      - UPLOAD_PATH=/app/uploads
      - WATCH_FOLDER=/app/watch
      - ALLOWED_FILE_TYPES=pdf,png,jpg,jpeg,tiff,bmp,gif,txt,rtf,doc,docx
      - WATCH_INTERVAL_SECONDS=30
      - FILE_STABILITY_CHECK_MS=500
      - MAX_FILE_AGE_HOURS=168
      - OCR_LANGUAGE=eng
      - CONCURRENT_OCR_JOBS=4
      - OCR_TIMEOUT_SECONDS=300
      - MAX_FILE_SIZE_MB=50
      - MEMORY_LIMIT_MB=512
      - CPU_PRIORITY=normal
      - ADMIN_PASSWORD=readur2024
    depends_on:
      readur-postgres:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    x-runtipi:
      internal_port: 8000
      is_main: true
  readur-postgres:
    image: postgres:17.5
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=readur
      - POSTGRES_PASSWORD=readur_password
      - POSTGRES_DB=readur
    healthcheck:
      test: pg_isready -U readur
      interval: 10s
      timeout: 5s
      retries: 5
x-runtipi:
  schema_version: 2
