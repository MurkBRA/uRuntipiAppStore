services:
  dcrpulse:
    image: ghcr.io/karamble/dcrpulse-dashboard:1.0.3
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/app-data:ro
    environment:
      - PORT=8735
      - DCRD_RPC_HOST=dcrpulse-dcrd
      - DCRD_RPC_PORT=9109
      - DCRD_RPC_USER=${APP_SEED}
      - DCRD_RPC_PASS=${APP_SEED}
      - DCRD_RPC_CERT=/app-data/dcrd/rpc.cert
      - DCRWALLET_RPC_HOST=dcrpulse-dcrwallet
      - DCRWALLET_RPC_PORT=9110
      - DCRWALLET_GRPC_PORT=9111
      - DCRWALLET_RPC_USER=${APP_SEED}
      - DCRWALLET_RPC_PASS=${APP_SEED}
      - DCRWALLET_RPC_CERT=/app-data/dcrd/rpc.cert
    depends_on:
      dcrpulse-dcrd:
        condition: service_healthy
      dcrpulse-dcrwallet:
        condition: service_healthy
    x-runtipi:
      internal_port: 8735
      is_main: true
  dcrpulse-dcrd:
    image: ghcr.io/karamble/dcrpulse-dcrd:2.1.3
    command: '--rpcuser=${APP_SEED} --rpcpass=${APP_SEED} --rpclisten=0.0.0.0:9109 --rpccert=/app-data/dcrd/rpc.cert --rpckey=/app-data/dcrd/rpc.key'
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
    environment:
      - DCRD_RPC_USER=${APP_SEED}
      - DCRD_RPC_PASS=${APP_SEED}
      - DCRD_EXTRA_ARGS=--txindex
      - TOR_PROXY_IP=${TOR_PROXY_IP}
      - TOR_PROXY_PORT=${TOR_PROXY_PORT}
    healthcheck:
      test: 'sh -c curl -k -u ${APP_SEED}:${APP_SEED} -H ''Content-Type: application/json'' -d ''{"jsonrpc":"1.0","method":"getinfo","params":[],"id":1}'' https://127.0.0.1:9109 || exit 1'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 5m
  dcrpulse-dcrwallet:
    image: ghcr.io/karamble/dcrpulse-dcrwallet:2.1.3
    command: '--gaplimit=400'
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
    environment:
      - DCRWALLET_RPC_USER=${APP_SEED}
      - DCRWALLET_RPC_PASS=${APP_SEED}
      - DCRD_RPC_USER=${APP_SEED}
      - DCRD_RPC_PASS=${APP_SEED}
      - DCRD_RPC_HOST=dcrpulse-dcrd
      - DCRWALLET_GAP_LIMIT=400
      - TOR_PROXY_IP=${TOR_PROXY_IP}
      - TOR_PROXY_PORT=${TOR_PROXY_PORT}
    depends_on:
      dcrpulse-dcrd:
        condition: service_healthy
    healthcheck:
      test: sh -c nc -z 127.0.0.1 9110 && nc -z 127.0.0.1 9111 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 1m
x-runtipi:
  schema_version: 2
