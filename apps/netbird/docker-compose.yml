services:
  netbird:
    image: nginx:1.27
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
    x-runtipi:
      internal_port: 80
      is_main: true
  netbird-app:
    image: ghcr.io/netbirdio/netbird:0.82.1-rootless
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/var/lib/netbird
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
  netbird-status:
    image: ghcr.io/netbirdio/netbird:0.82.1-rootless
    command:
      - |
        trap 'exit 0' TERM INT
        while true; do
          if netbird status --json 2>/dev/null | grep -q '"daemonStatus": *"Connected"' \
            && ! grep -q '"status":"connected"' /www/status.json 2>/dev/null; then
            echo '{"status":"connected","message":"Connected to NetBird"}' > /www/status.json.tmp
            mv -f /www/status.json.tmp /www/status.json
          fi
          sleep 5 & wait $$!
        done
    entrypoint:
      - /bin/bash
      - '-c'
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/var/lib/netbird:ro
      - ${APP_DATA_DIR}/data/www:/www
x-runtipi:
  schema_version: 2
