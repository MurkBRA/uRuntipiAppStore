services:
  netbird:
    image: nginx:1.27
    volumes:
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html:ro
    x-runtipi:
      internal_port: 80
      is_main: true
  netbird-app:
    image: ghcr.io/netbirdio/netbird:0.81.3-rootless
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/var/lib/netbird
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
x-runtipi:
  schema_version: 2
