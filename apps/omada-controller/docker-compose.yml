services:
  omada-controller:
    image: caddy:2.11.9-alpine
    command:
      - sh
      - '-c'
      - |
        cat > /tmp/Caddyfile <<'CADDY'
        {
          admin off
        }
        :8074 {
          reverse_proxy https://host.docker.internal:8043 {
            transport http {
              tls_insecure_skip_verify
            }
            header_down Location ^https?://[^/]+:(8043|8072) ""
          }
        }
        CADDY
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    user: ${APP_CONTAINER_USER:-1000:1000}
    extra_hosts:
      - host.docker.internal:host-gateway
    x-runtipi:
      internal_port: 8074
      is_main: true
  omada-controller-server:
    image: mbentley/omada-controller:6.3.0.111
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/tplink/EAPController/data
      - ${APP_DATA_DIR}/data/logs:/opt/tplink/EAPController/logs
    environment:
      - PUID=1000
      - PGID=1000
      - MANAGE_HTTP_PORT=8072
      - PORTAL_HTTP_PORT=8072
    network_mode: host
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 60s
x-runtipi:
  schema_version: 2
