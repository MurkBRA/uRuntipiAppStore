services:
  wealthfolio:
    image: wealthfolio/wealthfolio:3.10.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - WF_LISTEN_ADDR=0.0.0.0:8088
      - WF_DB_PATH=/data/wealthfolio.db
      - WF_AUTH_REQUIRED=false
      - WF_AUTH_TOKEN_TTL_MINUTES=60
      - WF_REQUEST_TIMEOUT_MS=30000
      - WF_SECRET_KEY=${APP_WEALTHFOLIO_SECRET_KEY}
    healthcheck:
      test: wget --quiet --tries=1 --spider http://127.0.0.1:8088/api/v1/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    x-runtipi:
      internal_port: 8088
      is_main: true
x-runtipi:
  schema_version: 2
