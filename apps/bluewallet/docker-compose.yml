services:
  bluewallet:
    image: bluewalletorganization/lndhub:v1.4.1
    user: '1000:1000'
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
    environment:
      - PORT=3008
      - TOR_URL=${APP_DOMAIN}
      - LND_CERT_FILE=/lnd/tls.cert
      - LND_ADMIN_MACAROON_FILE=/lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/admin.macaroon
      - 'CONFIG={ "rateLimit": 10000, "postRateLimit": 10000, "redis": { "port": 6379, "host": "bluewallet-redis", "family": 4, "password": "moneyprintergobrrr", "db": 0 }, "lnd": { "url": "${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}", "password": ""}}'
    depends_on:
      - bluewallet-redis
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 3008
      add_to_main_network: true
      is_main: true
  bluewallet-redis:
    image: redis:6.2.2-buster
    command: redis-server --requirepass moneyprintergobrrr
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    stop_grace_period: 1m
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
