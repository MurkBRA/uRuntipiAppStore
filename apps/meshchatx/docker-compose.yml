services:
  meshchatx:
    image: ghcr.io/quad4-software/meshchatx:4.10.7
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data:/config
    environment:
      - MESHCHAT_NO_HTTPS=true
    healthcheck:
      test: python -c import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/status')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
