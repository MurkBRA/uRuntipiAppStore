services:
  albyhub:
    image: ghcr.io/getalby/hub:v1.24.3
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/app-data/lightning/data/lnd:/lnd:ro
    environment:
      - LN_BACKEND_TYPE=${APP_ALBYHUB_LN_BACKEND}
      - LND_ADDRESS=10.21.21.9:10009
      - LND_CERT_FILE=/lnd/tls.cert
      - LND_MACAROON_FILE=/lnd/data/chain/bitcoin/mainnet/admin.macaroon
      - WORK_DIR=/data/albyhub
      - COOKIE_SECRET=${APP_SEED}
      - HIDE_UPDATE_BANNER=true
      - LOG_EVENTS=true
    stop_grace_period: 3m
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
