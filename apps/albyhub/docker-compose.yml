services:
  albyhub:
    image: ghcr.io/getalby/hub:v1.24.6
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/app-data/lightning/data/lnd:/lnd:ro
    environment:
      - LN_BACKEND_TYPE=${APP_ALBYHUB_LN_BACKEND}
      - LND_ADDRESS=${APP_ALBYHUB_LND_ADDRESS}
      - LND_CERT_FILE=${APP_ALBYHUB_LND_CERT_FILE}
      - LND_MACAROON_FILE=${APP_ALBYHUB_LND_MACAROON_FILE}
      - WORK_DIR=/data/albyhub
      - COOKIE_SECRET=${APP_SEED}
      - HIDE_UPDATE_BANNER=true
      - LOG_EVENTS=true
    stop_grace_period: 3m
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
