services:
  libre-relay:
    image: ghcr.io/petertodd/umbrel-bitcoin-libre-relay:libre-relay-v28.0-2
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
      - ${APP_DATA_DIR}/data/bitcoin:/bitcoin/.bitcoin
    environment:
      - PORT=3005
      - BITCOIN_HOST=libre-relay-bitcoind
      - RPC_PORT=8452
      - BITCOIN_RPC_PORT=8452
      - RPC_USER=${APP_LIBRE_RELAY_RPC_USER}
      - BITCOIN_RPC_USER=${APP_LIBRE_RELAY_RPC_USER}
      - RPC_PASSWORD=${APP_LIBRE_RELAY_RPC_PASS}
      - BITCOIN_RPC_PASSWORD=${APP_LIBRE_RELAY_RPC_PASS}
      - BITCOIN_RPC_HIDDEN_SERVICE=${APP_LIBRE_RELAY_RPC_HIDDEN_SERVICE}
      - BITCOIN_P2P_HIDDEN_SERVICE=${APP_LIBRE_RELAY_P2P_HIDDEN_SERVICE}
      - BITCOIN_P2P_PORT=8453
      - DEVICE_DOMAIN_NAME=${APP_DOMAIN}
      - BITCOIN_DEFAULT_NETWORK=${BITCOIN_DEFAULT_NETWORK}
      - BITCOIN_INITIALIZE_WITH_CLEARNET_OVER_TOR=${BITCOIN_INITIALIZE_WITH_CLEARNET_OVER_TOR}
      - BITCOIND_IP=libre-relay-bitcoind
      - TOR_PROXY_IP=10.21.22.21
      - TOR_PROXY_PORT=9050
      - TOR_PROXY_CONTROL_PORT=9051
      - TOR_PROXY_CONTROL_PASSWORD=moneyprintergobrrr
      - I2P_DAEMON_IP=libre-relay-i2pd_daemon
      - I2P_DAEMON_PORT=7656
    depends_on:
      - libre-relay-bitcoind
    x-runtipi:
      internal_port: 3005
      is_main: true
  libre-relay-bitcoind:
    image: ghcr.io/petertodd/bitcoin:libre-relay-v30.2-2
    command: ${APP_LIBRE_RELAY_COMMAND}
    user: '1000:1000'
    ports:
      - 8453:8453/tcp
      - 8452:8452/tcp
    volumes:
      - ${APP_DATA_DIR}/data/bitcoin:/data/.bitcoin
    stop_grace_period: 15m30s
  libre-relay-i2pd_daemon:
    image: purplei2p/i2pd:release-2.44.0
    command: '--sam.enabled=true --sam.address=0.0.0.0 --sam.port=7656 --loglevel=error'
    user: root
    volumes:
      - ${APP_DATA_DIR}/data/i2pd:/home/i2pd/data
x-runtipi:
  schema_version: 2
