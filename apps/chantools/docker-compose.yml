services:
  chantools:
    image: guggero/chantools:v0.14.1-umbrel
    command:
      - ttyd
      - '-W'
      - '-p'
      - '7682'
      - bash
      - '-c'
      - /bash-wrapper.sh
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data:/chantools
      - ${APP_DATA_DIR}/data/app-data/lightning/data/lnd:/lnd:ro
    stop_grace_period: 1s
    x-runtipi:
      internal_port: 7682
      is_main: true
x-runtipi:
  schema_version: 2
