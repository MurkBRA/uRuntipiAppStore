services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.1-ce.0
    hostname: gitlab
    ports:
      - 2424:22/tcp
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/gitlab
      - ${APP_DATA_DIR}/data/logs:/var/log/gitlab
      - ${APP_DATA_DIR}/data/data:/var/opt/gitlab
    environment:
      - |-
        GITLAB_OMNIBUS_CONFIG=external_url '${APP_PROTOCOL:-http}://${APP_DOMAIN}'
        gitlab_rails['initial_root_password'] = '${APP_PASSWORD}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        gitlab_rails['nginx']['listen_port'] = 8929
        gitlab_rails['nginx']['listen_https'] = false
    shm_size: 256m
    x-runtipi:
      internal_port: 8929
      is_main: true
x-runtipi:
  schema_version: 2
