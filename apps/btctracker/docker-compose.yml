services:
  btctracker:
    image: thewilqq/btc-tracker:v0.8.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/bitcoin-tracker.db
      - NEXTAUTH_SECRET=${APP_SEED}
      - NEXTAUTH_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
