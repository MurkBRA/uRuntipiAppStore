services:
  formicaio:
    image: bochaco/formicaio_proxy:0.3.0
    user: '1000:1000'
    environment:
      - FORMICAIO_ADDR=host.docker.internal:3000
      - FORMICAIO_PROXY_PORT=52100
    extra_hosts:
      - host.docker.internal:host-gateway
    x-runtipi:
      internal_port: 52100
      is_main: true
  formicaio-app:
    image: bochaco/formicaio:0.8.9-native-lcd-disabled
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/formicaio:/data
    environment:
      - DB_PATH=/data
      - NODE_MGR_ROOT_DIR=/data
      - LEPTOS_SITE_ADDR=0.0.0.0:3000
    network_mode: host
    stop_grace_period: 5s
x-runtipi:
  schema_version: 2
