services:
  kitchenowl:
    image: tombursch/kitchenowl:v0.7.10
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/kitchenowl_files:/data
    environment:
      - JWT_SECRET_KEY=${APP_PASSWORD}
      - DB_DRIVER=postgresql
      - DB_HOST=kitchenowl-db
      - DB_NAME=kitchenowl
      - DB_USER=kitchenowl
      - DB_PASSWORD=password
    depends_on:
      - kitchenowl-db
    x-runtipi:
      internal_port: 8080
      is_main: true
  kitchenowl-db:
    image: postgres:17.4
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/kitchenowl_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=kitchenowl
      - POSTGRES_USER=kitchenowl
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
x-runtipi:
  schema_version: 2
