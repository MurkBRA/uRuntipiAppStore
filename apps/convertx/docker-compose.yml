services:
  convertx:
    image: c4illin/convertx:v0.19.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/data
    environment:
      - HTTP_ALLOWED=true
      - ACCOUNT_REGISTRATION=true
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
