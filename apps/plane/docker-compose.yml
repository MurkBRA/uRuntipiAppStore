services:
  plane:
    image: nginx:alpine3.23
    volumes:
      - ${APP_DATA_DIR}/data/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plane-web
    x-runtipi:
      internal_port: 8762
      is_main: true
  plane-db:
    image: postgres:17.9-alpine
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - <<=[object Object]
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 10
  plane-redis:
    image: valkey/valkey:7.2.12-alpine
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
  plane-rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/rabbitmq:/var/lib/rabbitmq
    environment:
      - <<=[object Object]
  plane-minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /export --console-address ":8763"
    user: ${APP_CONTAINER_USER:-1000:1000}
    ports:
      - 8763:8763/tcp
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/export
    environment:
      - <<=[object Object]
  plane-api:
    image: makeplane/plane-backend:v1.4.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_started
      plane-rabbitmq:
        condition: service_started
  plane-worker:
    image: makeplane/plane-backend:v1.4.2
    command:
      - sh
      - '-c'
      - celery -A plane worker --loglevel=info
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      plane-api:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-rabbitmq:
        condition: service_started
  plane-beat-worker:
    image: makeplane/plane-backend:v1.4.2
    command:
      - sh
      - '-c'
      - celery -A plane beat --loglevel=info
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      plane-api:
        condition: service_started
      plane-redis:
        condition: service_started
      plane-rabbitmq:
        condition: service_started
      plane-migrator:
        condition: service_completed_successfully
  plane-migrator:
    image: makeplane/plane-backend:v1.4.2
    command:
      - sh
      - '-c'
      - python manage.py wait_for_db && python manage.py migrate
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      plane-db:
        condition: service_healthy
  plane-web:
    image: makeplane/plane-frontend:v1.4.2
    environment:
      - <<=[object Object]
    depends_on:
      - plane-api
  plane-live:
    image: makeplane/plane-live:v1.4.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      - plane-api
  plane-space:
    image: makeplane/plane-space:v1.4.2
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - <<=[object Object]
    depends_on:
      - plane-api
    healthcheck:
      test: 'node -e "require(''http'').get(''http://127.0.0.1:3000/'', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  plane-admin:
    image: makeplane/plane-admin:v1.4.2
    environment:
      - <<=[object Object]
    depends_on:
      - plane-api
x-runtipi:
  schema_version: 2
