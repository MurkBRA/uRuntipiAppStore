services:
  monetr:
    image: ghcr.io/monetr/monetr:1.19.0
    command:
      - serve
      - '--migrate'
      - '--generate-certificates'
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/app:/etc/monetr
    environment:
      - MONETR_ALLOW_SIGN_UP=${MONETR_ALLOW_SIGN_UP}
      - MONETR_PROOF_OF_WORK_ENABLED=${MONETR_PROOF_OF_WORK_ENABLED}
      - MONETR_PG_USERNAME=postgres
      - MONETR_PG_PASSWORD=m0netrPass123
      - MONETR_PG_DATABASE=monetr
      - MONETR_PG_ADDRESS=monetr-db
      - MONETR_PG_PORT=5432
      - MONETR_REDIS_ENABLED=true
      - MONETR_REDIS_ADDRESS=monetr-valkey
      - MONETR_REDIS_PORT=6379
      - MONETR_STORAGE_ENABLED=${MONETR_STORAGE_ENABLED}
      - MONETR_STORAGE_PROVIDER=${MONETR_STORAGE_PROVIDER}
    depends_on:
      monetr-db:
        condition: service_healthy
      monetr-valkey:
        condition: service_healthy
    x-runtipi:
      internal_port: 4000
      is_main: true
  monetr-db:
    image: postgres:17.9
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=m0netrPass123
      - POSTGRES_USER=postgres
      - POSTGRES_DB=monetr
    healthcheck:
      test: pg_isready -U postgres || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
  monetr-valkey:
    image: valkey/valkey:9
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/valkey:/data
    healthcheck:
      test: valkey-cli ping
      interval: 10s
      timeout: 5s
      retries: 10
x-runtipi:
  schema_version: 2
