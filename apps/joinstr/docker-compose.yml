services:
  joinstr:
    image: ghcr.io/1440000bytes/joinstr-web:0.1.2
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - JOINSTR_MANAGED=1
      - JOINSTR_WALLET=joinstr
      - JOINSTR_DATA_DIR=/app/data
      - BITCOIN_RPC_HOST=${APP_BITCOIN_NODE_IP}
      - BITCOIN_RPC_PORT=${APP_BITCOIN_RPC_PORT}
      - BITCOIN_RPC_USER=${APP_BITCOIN_RPC_USER}
      - BITCOIN_RPC_PASS=${APP_BITCOIN_RPC_PASS}
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 5000
      add_to_main_network: true
      is_main: true
x-runtipi:
  schema_version: 2
