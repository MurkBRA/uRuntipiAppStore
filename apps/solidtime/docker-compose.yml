services:
  solidtime:
    image: solidtime/solidtime:0.22.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/app:/var/www/html/storage
    environment:
      - CONTAINER_MODE=http
      - AUTO_DB_MIGRATE=true
      - APP_NAME=solidtime
      - VITE_APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - APP_FORCE_HTTPS=false
      - TRUSTED_PROXIES=0.0.0.0/0,2000:0:0:0:0:0:0:0/3
      - TRUSTED_HOSTS=${APP_DOMAIN},${LOCAL_DOMAIN},${APP_DOMAIN},${APP_DOMAIN},${local_ips}
      - SUPER_ADMINS=${SUPER_ADMINS}
      - LOG_CHANNEL=stderr_daily
      - LOG_LEVEL=debug
      - DB_CONNECTION=pgsql
      - DB_HOST=solidtime-db
      - DB_PORT=5432
      - DB_SSL_MODE=prefer
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=solidtime
      - MAIL_MAILER=smtp
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=no-reply@your-domain.com
      - MAIL_FROM_NAME=solidtime
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
      - PUBLIC_FILESYSTEM_DISK=public
      - GOTENBERG_URL=http://solidtime-gotenberg:3000
    depends_on:
      solidtime-db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:8000/health-check/up || exit 1
    x-runtipi:
      internal_port: 8000
      is_main: true
  solidtime-scheduler:
    image: solidtime/solidtime:0.22.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/app:/var/www/html/storage
    environment:
      - CONTAINER_MODE=scheduler
      - APP_NAME=solidtime
      - VITE_APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - APP_FORCE_HTTPS=false
      - TRUSTED_PROXIES=0.0.0.0/0,2000:0:0:0:0:0:0:0/3
      - TRUSTED_HOSTS=${APP_DOMAIN},${LOCAL_DOMAIN},${APP_DOMAIN},${APP_DOMAIN},${local_ips}
      - SUPER_ADMINS=${SUPER_ADMINS}
      - LOG_CHANNEL=stderr_daily
      - LOG_LEVEL=debug
      - DB_CONNECTION=pgsql
      - DB_HOST=solidtime-db
      - DB_PORT=5432
      - DB_SSL_MODE=prefer
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=solidtime
      - MAIL_MAILER=smtp
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=no-reply@your-domain.com
      - MAIL_FROM_NAME=solidtime
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
      - PUBLIC_FILESYSTEM_DISK=public
      - GOTENBERG_URL=http://solidtime-gotenberg:3000
    depends_on:
      solidtime-db:
        condition: service_healthy
    healthcheck:
      test: healthcheck
  solidtime-queue:
    image: solidtime/solidtime:0.22.0
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/app:/var/www/html/storage
    environment:
      - CONTAINER_MODE=worker
      - WORKER_COMMAND=php /var/www/html/artisan queue:work
      - APP_NAME=solidtime
      - VITE_APP_NAME=solidtime
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - APP_FORCE_HTTPS=false
      - TRUSTED_PROXIES=0.0.0.0/0,2000:0:0:0:0:0:0:0/3
      - TRUSTED_HOSTS=${APP_DOMAIN},${LOCAL_DOMAIN},${APP_DOMAIN},${APP_DOMAIN},${local_ips}
      - SUPER_ADMINS=${SUPER_ADMINS}
      - LOG_CHANNEL=stderr_daily
      - LOG_LEVEL=debug
      - DB_CONNECTION=pgsql
      - DB_HOST=solidtime-db
      - DB_PORT=5432
      - DB_SSL_MODE=prefer
      - DB_DATABASE=solidtime
      - DB_USERNAME=solidtime
      - DB_PASSWORD=solidtime
      - MAIL_MAILER=smtp
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=no-reply@your-domain.com
      - MAIL_FROM_NAME=solidtime
      - QUEUE_CONNECTION=database
      - FILESYSTEM_DISK=local
      - PUBLIC_FILESYSTEM_DISK=public
      - GOTENBERG_URL=http://solidtime-gotenberg:3000
    depends_on:
      solidtime-db:
        condition: service_healthy
    healthcheck:
      test: healthcheck
  solidtime-db:
    image: postgres:17.3
    user: '1000:1000'
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - PGPASSWORD=soldtime
      - POSTGRES_DB=solidtime
      - POSTGRES_USER=solidtime
      - POSTGRES_PASSWORD=solidtime
    healthcheck:
      test: pg_isready -q -d solidtime -U solidtime
      timeout: 5s
      retries: 3
  solidtime-gotenberg:
    image: gotenberg/gotenberg:8.17.1
    user: '1000:1000'
    healthcheck:
      test: curl --silent --fail http://localhost:3000/health
x-runtipi:
  schema_version: 2
