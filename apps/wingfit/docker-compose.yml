services:
  wingfit:
    image: ghcr.io/itskovacs/wingfit:5.3.1
    command:
      - fastapi
      - run
      - /app/wingfit/main.py
      - '--host'
      - 0.0.0.0
    volumes:
      - ${APP_DATA_DIR}/data:/app/storage
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
