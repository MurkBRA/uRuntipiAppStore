services:
  pyload-ng:
    image: linuxserver/pyload-ng:0.5.0
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/downloads:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    x-runtipi:
      internal_port: 8000
      is_main: true
x-runtipi:
  schema_version: 2
