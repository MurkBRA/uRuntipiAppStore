services:
  scanservjs:
    image: sbs20/scanservjs:v3.3.0
    volumes:
      - ${APP_DATA_DIR}/data/scans:/var/lib/scanservjs/output
      - ${APP_DATA_DIR}/data/config:/etc/scanservjs
      - /var/run/dbus:/var/run/dbus
      - /dev:/dev
    privileged: true
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
