services:
  leafwiki:
    image: ghcr.io/perber/leafwiki:v0.14.1
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - LEAFWIKI_JWT_SECRET=${APP_SEED}
      - LEAFWIKI_ADMIN_PASSWORD=${APP_PASSWORD}
      - LEAFWIKI_ALLOW_INSECURE=true
    x-runtipi:
      internal_port: 8080
      is_main: true
x-runtipi:
  schema_version: 2
