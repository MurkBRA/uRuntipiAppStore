services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v2.17.3
    volumes:
      - ${APP_DATA_DIR}/data/app_data:/app/data
      - ${APP_DATA_DIR}/data/projects:/app/data/projects
      - ${APP_DATA_DIR}/data/docker:/var/run
    environment:
      - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-${APP_PASSWORD}}
    depends_on:
      arcane-docker:
        condition: service_healthy
    stop_grace_period: 15s
    x-runtipi:
      internal_port: 3552
      is_main: true
  arcane-docker:
    image: docker:27.2.0-dind
    command: |-
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --pidfile /data/docker.pid
    entrypoint: /entrypoint.sh
    volumes:
      - ${APP_DATA_DIR}/data/entrypoint.sh:/entrypoint.sh
      - ${APP_DATA_DIR}/data/docker:/data
    environment:
      - DOCKER_ENSURE_BRIDGE=dind0:10.32.0.1/16
    network_mode: host
    healthcheck:
      test: docker --host unix:///data/docker.sock version
      interval: 5s
      timeout: 10s
      retries: 6
      start_period: 5m
    privileged: true
    stop_grace_period: 1m
x-runtipi:
  schema_version: 2
