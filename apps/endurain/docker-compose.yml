services:
  endurain:
    image: ghcr.io/endurain-project/endurain:v0.20.1
    volumes:
      - ${APP_DATA_DIR}/data/app:/app/backend/data
      - ${APP_DATA_DIR}/data/logs:/app/backend/logs
    environment:
      - DB_TYPE=postgres
      - DB_HOST=endurain-db
      - DB_PORT=5432
      - DB_PASSWORD=endurain
      - SECRET_KEY=${APP_SECRET_KEY:-${APP_PASSWORD}}
      - BEHIND_PROXY=true
      - TRUSTED_PROXIES=${INTERNAL_IP}/16
      - DEPLOYMENT_PROFILE=local
      - WEB_WORKERS=1
    depends_on:
      endurain-db:
        condition: service_healthy
    x-runtipi:
      internal_port: 8080
      is_main: true
  endurain-db:
    image: postgres:17.4
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=endurain
      - POSTGRES_DB=endurain
      - POSTGRES_USER=endurain
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: pg_isready -U endurain
      interval: 5s
      timeout: 5s
      retries: 5
x-runtipi:
  schema_version: 2
