services:
  pastefy:
    image: interaapps/pastefy:7.1.6
    user: ${APP_CONTAINER_USER:-1000:1000}
    environment:
      - HTTP_SERVER_CORS=*
      - DATABASE_DRIVER=mysql
      - DATABASE_NAME=pastefy
      - DATABASE_USER=pastefy
      - DATABASE_PASSWORD=tyooe
      - DATABASE_HOST=pastefy-db
      - DATABASE_PORT=3306
      - SERVER_NAME=${APP_PROTOCOL:-http}://${APP_DOMAIN}
    depends_on:
      - pastefy-db
    x-runtipi:
      internal_port: 80
      is_main: true
  pastefy-db:
    image: mariadb:11.4.5
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=tyooe
      - MYSQL_DATABASE=pastefy
      - MYSQL_USER=pastefy
      - MYSQL_PASSWORD=tyooe
x-runtipi:
  schema_version: 2
