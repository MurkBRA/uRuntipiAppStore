services:
  lnbits-holesail-proxy:
    image: orenz0/holesail-server-manager:v1.0.7
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - HSM_DATA_FILE=/data/hsm.json
      - HSM_HOST=0.0.0.0
      - HSM_PORT=3107
      - HSM_TITLE=LNbits Holesail Proxy
      - HSM_TARGET_ADDRESS=lnbits_web_1
      - HSM_TARGET_PORT=3007
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 3107
      add_to_main_network: true
      is_main: true
x-runtipi:
  schema_version: 2
