services:
  libreoffice:
    image: linuxserver/libreoffice:25.8.7
    hostname: libreoffice
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    environment:
      - PUID=1000
      - PGID=1000
    shm_size: 1gb
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 3000
      is_main: true
x-runtipi:
  schema_version: 2
