services:
  lndg:
    image: ghcr.io/cryptosharks131/lndg:v1.11.1
    command:
      - sh
      - '-c'
      - python initialize.py -net '${APP_BITCOIN_NETWORK}' -rpc '${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}' -pw '${APP_PASSWORD}' -csrf "$${LNDG_CSRF_TRUSTED_ORIGINS}" -wn && python controller.py runserver 0.0.0.0:8889
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/root/.lnd:ro
      - ${APP_DATA_DIR}/data/db:/app/data
    environment:
      - LNDG_CSRF_TRUSTED_ORIGINS=${APP_LNDG_CSRF_TRUSTED_ORIGINS}
    stop_grace_period: 1m
    x-runtipi:
      internal_port: 8889
      add_to_main_network: true
      is_main: true
x-runtipi:
  schema_version: 2
