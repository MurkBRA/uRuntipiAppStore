services:
  yucca:
    image: yuccastream/yucca:0.13.4
    working_dir: /opt/yucca
    ports:
      - 10925:10925/tcp
      - 9912:9912/tcp
    volumes:
      - ${APP_DATA_DIR}/data/data:/opt/yucca/data
    environment:
      - YUCCA_SERVER_DATA_DIR=/opt/yucca/data
      - YUCCA_SMTP_SERVER_LISTEN_ADDRESS=:10925
    shm_size: 128mb
    x-runtipi:
      internal_port: 9910
      is_main: true
x-runtipi:
  schema_version: 2
