services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    ports:
      - 8554:8554/tcp
      - 8555:8555/tcp
      - 8555:8555/udp
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/storage:/media/frigate
    environment:
      - FRIGATE_RTSP_PASSWORD=${APP_PASSWORD}
    shm_size: 128mb
    privileged: true
    x-runtipi:
      internal_port: 8971
      is_main: true
x-runtipi:
  schema_version: 2
