services:
  agora:
    image: nginx:1.19-alpine
    volumes:
      - ${APP_DATA_DIR}/data/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template
      - ${APP_DATA_DIR}/data/www:/usr/share/nginx/html
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/
      - APP_AGORA_SERVER_IP=agora-agora-sidecar
      - APP_AGORA_FILEBROWSER_IP=agora-filebrowser
      - APP_HIDDEN_SERVICE=${APP_DOMAIN}
    depends_on:
      - agora-agora-sidecar
      - agora-filebrowser
    x-runtipi:
      internal_port: 80
      add_to_main_network: true
      is_main: true
  agora-filebrowser:
    image: filebrowser/filebrowser:v2.21.1
    entrypoint: /data/entrypoint.sh
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/files:/srv
      - ${APP_DATA_DIR}/data/database/filebrowser.db:/database.db
      - ${APP_DATA_DIR}/data:/data
    environment:
      - APP_PASSWORD=${APP_PASSWORD}
    stop_grace_period: 1m
    x-runtipi:
      add_to_main_network: true
  agora-agora-sidecar:
    image: ghcr.io/agora-org/agora:sha-48d3205
    user: ${APP_CONTAINER_USER:-1000:1000}
    volumes:
      - ${APP_DATA_DIR}/data/files:/files
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
    environment:
      - LND_RPC_AUTHORITY=${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_GRPC_PORT}
      - TLS_CERT_PATH=/lnd/tls.cert
      - INVOICES_MACAROON_PATH=/lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/invoice.macaroon
      - FILES_DIR=/files
      - AGORA_PORT=8080
    stop_grace_period: 1m
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
