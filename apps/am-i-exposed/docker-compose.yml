services:
  am-i-exposed:
    image: ghcr.io/copexit/am-i-exposed-umbrel:v0.43.1
    user: '101:101'
    environment:
      - APP_MEMPOOL_IP=${APP_MEMPOOL_IP}
      - APP_MEMPOOL_PORT=${APP_MEMPOOL_PORT}
      - APP_MEMPOOL_HIDDEN_SERVICE=${APP_MEMPOOL_HIDDEN_SERVICE}
      - APP_TOR_PROXY_IP=am-i-exposed-tor-proxy
      - APP_TOR_PROXY_PORT=3001
    depends_on:
      - am-i-exposed-tor-proxy
    healthcheck:
      test: wget -qO- http://127.0.0.1:8080/health || exit 1
      interval: 30s
      timeout: 3s
    stop_grace_period: 30s
    x-runtipi:
      internal_port: 8080
      add_to_main_network: true
      is_main: true
  am-i-exposed-tor-proxy:
    image: ghcr.io/copexit/am-i-exposed-tor-proxy:v0.43.1
    user: '1000:1000'
    environment:
      - PORT=3001
      - TOR_PROXY_IP=${TOR_PROXY_IP}
      - TOR_PROXY_PORT=${TOR_PROXY_PORT}
    stop_grace_period: 10s
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2
