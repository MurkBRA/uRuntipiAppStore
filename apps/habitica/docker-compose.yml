services:
  habitica:
    image: awinterstein/habitica-server:5.50.6
    command: 'sh -c "perl -0pi -e ''s/upgradeInsecureRequests: IS_PROD \\? \\[\\] : null,?/upgradeInsecureRequests: null/g'' /var/lib/habitica/website/server/middlewares/index.js /var/lib/habitica/website/transpiled-babel/middlewares/index.js && printenv | grep -v ''no_proxy'' >> /etc/environment && /etc/init.d/cron start && node /var/lib/habitica/website/transpiled-babel/index.js"'
    environment:
      - NODE_DB_URI=mongodb://habitica-mongo/habitica
      - BASE_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN}
      - INVITE_ONLY=false
    depends_on:
      - habitica-mongo
    x-runtipi:
      internal_port: 3000
      is_main: true
  habitica-mongo:
    image: mongo:8.0.11
    command:
      - '--replSet'
      - rs
      - '--bind_ip_all'
      - '--port'
      - '27017'
    volumes:
      - ${APP_DATA_DIR}/data/db:/data/db
      - ${APP_DATA_DIR}/data/dbconf:/data/configdb
    healthcheck:
      test: 'echo "try { rs.status() } catch (err) { rs.initiate({ _id: ''rs'', members: [{ _id: 0, host: ''habitica-mongo:27017'' }] }) }" | mongosh --port 27017 --quiet'
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 0s
      start_interval: 1s
x-runtipi:
  schema_version: 2
